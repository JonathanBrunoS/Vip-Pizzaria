<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Pizzaria | Tradição no Forno a Lenha desde 1991</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --roxo-principal: #3d0c42;
            --roxo-vibrante: #6a1b70;
            --dourado-vip: #d4af37;
            --dourado-hover: #f5c518;
            --fundo-dark: #120314;
            --texto-escuro: #1a1a1a;
            --texto-suave: #555555;
            --ifood-red: #ea1d2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: var(--texto-escuro);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(61, 12, 66, 0.92) 0%, rgba(18, 3, 20, 0.95) 100%), 
                        url('https://i.ibb.co/RpHHHNts/CAPA-VIP.jpg') center/cover no-repeat;
            color: #ffffff;
            text-align: center;
            padding: 80px 20px 100px;
            box-shadow: inset 0 -50px 50px rgba(0,0,0,0.5);
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .logo-topo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--dourado-vip);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            object-fit: cover;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.25rem;
            font-weight: 300;
            max-width: 650px;
            margin: 0 auto 35px;
            opacity: 0.9;
        }

        .botoes-hero {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn-main {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--dourado-vip) 0%, #b89228 100%);
            color: #000;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
            transition: all 0.3s ease;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
            background: var(--dourado-hover);
        }

        .btn-wsp {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #25d366;
            color: #fff;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-wsp:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
            background: #20ba5a;
        }

        /* --- PLATAFORMAS DE DELIVERY --- */
        .plataformas-sec {
            padding: 70px 20px;
            background: #ffffff;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--roxo-principal);
            margin-bottom: 10px;
        }

        .section-subtitle {
            font-size: 1.1rem;
            color: var(--texto-suave);
            margin-bottom: 45px;
        }

        .grid-apps {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 1050px;
            margin: 0 auto;
        }

        .card-app {
            background: #ffffff;
            border: 2px solid #f0f0f0;
            border-radius: 20px;
            padding: 15px;
            width: 240px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .card-app:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .card-app img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .card-ifood {
            border: 2px solid var(--dourado-vip);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
        }

        /* --- MOCKUP CARDÁPIO DIGITAL (WHATSMENU) --- */
        .cardapio-sec {
            padding: 80px 20px;
            background: linear-gradient(180deg, #f8f9fa 0%, #ede8ef 100%);
            text-align: center;
        }

        .browser-mockup {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 18px;
            border: 3px solid var(--roxo-principal);
            box-shadow: 0 20px 50px rgba(61, 12, 66, 0.2);
            overflow: hidden;
        }

        .browser-header {
            background: var(--roxo-principal);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .browser-dots {
            display: flex;
            gap: 7px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .browser-title {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            padding: 5px 20px;
            border-radius: 20px;
            margin-left: auto;
            margin-right: auto;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 750px;
            background: #ffffff;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- GOOGLE REVIEWS / DEPOIMENTOS --- */
        .reviews-sec {
            padding: 80px 20px;
            background: #ffffff;
            text-align: center;
        }

        .google-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f1f3f4;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #3c4043;
            margin-bottom: 20px;
        }

        .carrossel-reviews {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 10px 20px 30px;
            max-width: 1100px;
            margin: 0 auto;
            scrollbar-width: thin;
        }

        .card-review {
            flex: 0 0 320px;
            scroll-snap-align: center;
            background: #fdfbff;
            border: 2px solid #f0e6f2;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stars { color: #f4c430; font-size: 1.2rem; margin-bottom: 12px; }
        
        .review-text {
            color: var(--texto-escuro);
            font-size: 0.98rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .reviewer-info strong { display: block; color: var(--roxo-principal); font-size: 1.05rem; }
        .reviewer-info span { color: #888; font-size: 0.85rem; }

        /* --- GALERIA E VINHOS --- */
        .galeria-sec {
            padding: 80px 20px;
            background: #f8f9fa;
            text-align: center;
        }

        .grid-pizzas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto 60px;
        }

        .card-pizza {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            transition: transform 0.3s ease;
        }

        .card-pizza:hover { transform: translateY(-5px); }
        .card-pizza img { width: 100%; height: 240px; object-fit: cover; }
        .card-pizza p { padding: 18px; font-weight: 700; color: var(--roxo-principal); font-size: 1.1rem; }

        /* Seção Adega */
        .adega-box {
            background: linear-gradient(135deg, var(--roxo-principal) 0%, var(--fundo-dark) 100%);
            color: #ffffff;
            border-radius: 24px;
            padding: 50px 30px;
            max-width: 1100px;
            margin: 0 auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .adega-box h3 { font-size: 2rem; color: var(--dourado-vip); margin-bottom: 10px; }

        .grid-vinhos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }

        .card-vinho img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }

        .card-vinho img:hover { transform: scale(1.04); }

        /* --- VÍDEO VERTICAL (REELS 9:16) --- */
        .video-sec {
            padding: 80px 20px;
            background: #ffffff;
            text-align: center;
        }

        .video-card-vertical {
            max-width: 360px;
            width: 100%;
            height: 640px;
            margin: 0 auto;
            background: #000000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(61, 12, 66, 0.3);
            border: 4px solid var(--roxo-vibrante);
            position: relative;
        }

        .video-card-vertical iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- LOCALIZAÇÃO EXECUTIVA --- */
        .localizacao-sec {
            padding: 80px 20px;
            background: #f8f9fa;
            border-top: 1px solid #eaeaea;
        }

        .grid-loc {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: center;
        }

        .info-loc-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #f0e6f2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
